name: Save article to Notion

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  save:
    if: github.event.issue.user.login == 'syukaisan-lang' && startsWith(github.event.issue.title, '[NOTION-SAVE]')
    runs-on: ubuntu-latest
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_DATA_SOURCE_ID: ${{ vars.NOTION_DATA_SOURCE_ID || 'b2fde79c-a98e-454a-8217-612a6eaec56d' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install "requests>=2.32,<3"
      - name: Create Notion page
        run: python scripts/save_to_notion.py
      - name: Read optional encrypted Weekly state
        env:
          WEEKLY_STATE_OPTIONAL: "1"
        run: python scripts/save_weekly_state.py
      - name: Commit piggybacked Weekly state when present
        run: |
          git config user.name "weekly-state-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/weekly-state.enc.json data/weekly-state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No Weekly state backup included"
          else
            git commit -m "Backup Weekly state with Notion save"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Confirm and close request
        if: success()
        run: |
          URL=$(python -c "import json; print(json.load(open('/tmp/notion_save_result.json')).get('url') or '')")
          gh issue comment "${{ github.event.issue.number }}" --body "✅ 已写入 Notion；如请求中包含 Weekly 加密状态，也已同步。${URL}"
          gh issue close "${{ github.event.issue.number }}"
      - name: Report failure
        if: failure()
        run: |
          ERR=$(cat /tmp/notion_save_error.txt 2>/dev/null || cat /tmp/weekly_state_error.txt 2>/dev/null || echo 'Unknown error')
          gh issue comment "${{ github.event.issue.number }}" --body "❌ 处理失败：${ERR}"
