name: Sync Notion knowledge

on:
  workflow_dispatch:
  schedule:
    # Daily 18:40 Japan time = 09:40 UTC
    - cron: "40 9 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_DATA_SOURCE_ID: ${{ vars.NOTION_DATA_SOURCE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install "requests>=2.32,<3"
      - name: Sync Notion Stock and comments
        run: python scripts/sync_notion.py
      - name: Commit refreshed Notion data
        run: |
          git config user.name "knowledge-dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/knowledge.json
          git diff --cached --quiet || git commit -m "Sync Notion knowledge"
          git push
