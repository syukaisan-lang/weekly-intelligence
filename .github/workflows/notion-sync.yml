name: Sync Notion knowledge

on:
  workflow_dispatch:
  schedule:
    # Friday 18:40 Japan time = 09:40 UTC
    - cron: "40 9 * * 5"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      DASHBOARD_PASSPHRASE: ${{ secrets.DASHBOARD_PASSPHRASE }}
      NOTION_DATA_SOURCE_ID: ${{ vars.NOTION_DATA_SOURCE_ID || 'b2fde79c-a98e-454a-8217-612a6eaec56d' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install "requests>=2.32,<3" "cryptography>=42,<47" "openai>=1.0,<3"
      - name: Sync Notion Stock, page body and comments
        run: python scripts/sync_notion.py
      - name: Rebuild callable Work System model
        run: python scripts/build_system_model_v2.py
      - name: Commit refreshed encrypted Notion data
        run: |
          git config user.name "knowledge-dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/knowledge.json data/knowledge.enc.json data/system-model.json data/system-model.enc.json
          git diff --cached --quiet || git commit -m "Sync Notion knowledge and consolidate Work System"
          git push
