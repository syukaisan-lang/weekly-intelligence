name: Sync Notion knowledge

on:
  workflow_dispatch:
  schedule:
    # Friday 18:40 Japan time = 09:40 UTC
    - cron: "40 9 * * 5"
  push:
    branches: [main]
    paths:
      - "scripts/temporal_knowledge.py"
      - "scripts/sync_notion_temporal.py"
      - ".github/workflows/notion-sync.yml"

permissions:
  contents: write

concurrency:
  group: notion-knowledge-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      DASHBOARD_PASSPHRASE: ${{ secrets.DASHBOARD_PASSPHRASE }}
      NOTION_DATA_SOURCE_ID: ${{ vars.NOTION_DATA_SOURCE_ID || 'b2fde79c-a98e-454a-8217-612a6eaec56d' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      SEMANTIC_MODEL_ID: intfloat/multilingual-e5-small
      SEMANTIC_BROWSER_MODEL_ID: Xenova/multilingual-e5-small
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: multilingual-e5-small-v1
      - name: Install CPU semantic dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4,<3"
          python -m pip install "requests>=2.32,<3" "cryptography>=42,<47" "openai>=1.0,<3" "sentence-transformers>=5,<6"
      - name: Sync Notion Stock, page body, comments and temporal evidence
        run: python scripts/sync_notion_temporal.py
      - name: Rebuild callable Work System model
        run: python scripts/build_system_model_precision.py
      - name: Rebuild encrypted multilingual semantic index
        run: python scripts/build_semantic_index.py
      - name: Commit refreshed encrypted Notion data
        run: |
          git config user.name "knowledge-dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/knowledge.json data/knowledge.enc.json data/system-model.json data/system-model.enc.json data/semantic-index.json data/semantic-index.enc.json
          git diff --cached --quiet || git commit -m "Sync Notion knowledge with temporal evidence and semantic index"
          git pull --rebase origin main
          git push
