name: Continue public article queue

on:
  workflow_dispatch:
  schedule:
    - cron: "35 0,6,12,18 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/public-body-retry.yml"

permissions:
  contents: write

concurrency:
  group: weekly-intelligence-update
  cancel-in-progress: false

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DASHBOARD_PASSPHRASE: ${{ secrets.DASHBOARD_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install public queue dependencies
        run: python -m pip install requests feedparser beautifulsoup4 python-dateutil cryptography numpy
      - name: Continue due public reads and refresh recommendations
        run: |
          python scripts/retry_uncertain_public_content.py
          node scripts/apply_priority_policy.cjs
          node scripts/build_articles_brief.cjs
      - name: Commit public evidence and queue progress
        run: |
          git config user.name "reading-dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/articles.json data/articles-brief.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Continue public article evidence queue"
          git pull --rebase origin main
          git push origin HEAD:main
