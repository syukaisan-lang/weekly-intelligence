name: Update feeds

on:
  workflow_dispatch:
  schedule:
    # Friday 19:05 Japan time = Friday 10:05 UTC
    - cron: "5 10 * * 5"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      DASHBOARD_PASSPHRASE: ${{ secrets.DASHBOARD_PASSPHRASE }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Build unified personal work system
        run: python scripts/build_system_model.py
      - name: Fetch and screen feeds against personal work system
        run: python scripts/update_feeds_personalized.py
      - name: Commit refreshed dashboard data
        run: |
          git config user.name "reading-dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update weekly intelligence and system model"
          git push
