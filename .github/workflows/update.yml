name: Update feeds

on:
  workflow_dispatch:
  schedule:
    # Friday 19:05 Japan time = Friday 10:05 UTC
    - cron: "5 10 * * 5"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      DASHBOARD_PASSPHRASE: ${{ secrets.DASHBOARD_PASSPHRASE }}
      NOTION_DATA_SOURCE_ID: ${{ vars.NOTION_DATA_SOURCE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Refresh encrypted Notion knowledge first
        run: python scripts/sync_notion.py
      - name: Fetch and screen feeds
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: python scripts/update_feeds.py
      - name: Commit refreshed dashboard data
        run: |
          git config user.name "reading-dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update weekly intelligence"
          git push
