name: Update feeds

on:
  workflow_dispatch:
  schedule:
    # Friday 19:05 Japan time = Friday 10:05 UTC
    - cron: "5 10 * * 5"
  workflow_run:
    workflows:
      - "Sync Notion knowledge"
      - "Sync personal work system"
    types: [completed]
  push:
    branches: [main]
    paths:
      - "scripts/update_feeds_personalized.py"
      - "scripts/update_feeds_temporal.py"
      - "scripts/weekly_lifecycle.py"
      - "scripts/weekly_semantic.py"
      - "scripts/weekly_semantic_runtime.py"
      - "scripts/personal_relevance.py"
      - "requirements.txt"
      - "data/knowledge.enc.json"
      - "data/system-model.enc.json"
      - "data/semantic-index.enc.json"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: weekly-intelligence-update
  cancel-in-progress: false

jobs:
  update:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      DASHBOARD_PASSPHRASE: ${{ secrets.DASHBOARD_PASSPHRASE }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      SEMANTIC_MODEL_ID: intfloat/multilingual-e5-small
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: multilingual-e5-small-v1
      - name: Install feed and semantic dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4,<3"
          python -m pip install -r requirements.txt
      - name: Fetch and screen feeds against latest Knowledge and Work System
        run: python scripts/update_feeds_temporal.py
      - name: Commit refreshed dashboard data safely
        run: |
          git config user.name "reading-dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data/articles.json /tmp/weekly-articles.json
          cp data/source_status.json /tmp/weekly-source-status.json
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/weekly-articles.json data/articles.json
            cp /tmp/weekly-source-status.json data/source_status.json
            git add data/articles.json data/source_status.json
            if git diff --cached --quiet; then
              echo "No Weekly data changes to commit"
              exit 0
            fi
            git commit -m "Update weekly intelligence with adaptive semantic temporal v8"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Weekly push raced with another commit; retrying from latest main ($attempt/3)"
            sleep 2
          done
          echo "Weekly data push failed after retries" >&2
          exit 1
