name: Validate dashboard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**.js"
      - "**.html"
      - "scripts/**.py"
      - ".github/workflows/**.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          for f in *.js; do
            echo "Checking $f"
            node --check "$f"
          done
      - name: Check Python syntax
        run: python -m py_compile scripts/*.py
      - name: Check required dashboard files
        run: |
          test -f index.html
          test -f knowledge.html
          test -f insights.html
          test -f private-knowledge.js
          test -f scripts/sync_notion.py
          test -f scripts/save_to_notion.py
