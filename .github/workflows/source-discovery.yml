name: Source discovery cache

on:
  workflow_dispatch:
  schedule:
    # 09:23 / 15:23 / 21:23 Japan time. URL/title/date only; no semantic scoring.
    - cron: "23 0,6,12 * * *"
  push:
    branches: [main]
    paths:
      - "config/sources.json"
      - "scripts/update_source_discovery.py"
      - ".github/workflows/source-discovery.yml"

permissions:
  contents: write

concurrency:
  group: source-discovery-cache
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install lightweight dependencies
        run: python -m pip install requests beautifulsoup4 feedparser python-dateutil
      - name: Discover all sources and independent high-risk listings
        run: python scripts/update_source_discovery.py
      - name: Commit rolling discovery cache safely
        run: |
          git config user.name "reading-dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data/source_discovery.json /tmp/source-discovery.json
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/source-discovery.json data/source_discovery.json
            git add data/source_discovery.json
            if git diff --cached --quiet; then
              echo "No source discovery changes"
              exit 0
            fi
            git commit -m "Update rolling source discovery cache"
            if git push origin HEAD:main; then exit 0; fi
            echo "Source discovery push raced; retrying ($attempt/3)"
            sleep 2
          done
          exit 1
