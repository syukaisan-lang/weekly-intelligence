name: Sync personal work system

on:
  workflow_dispatch:
  schedule:
    # Friday 18:20 Japan time = 09:20 UTC
    - cron: "20 9 * * 5"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      DASHBOARD_PASSPHRASE: ${{ secrets.DASHBOARD_PASSPHRASE }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install "requests>=2.32,<3" "cryptography>=42,<47" "google-auth>=2.35,<3" "openpyxl>=3.1,<4" "openai>=1.0,<3"
      - name: Sync Google work experience and reading notes
        run: python scripts/sync_work_system.py
      - name: Reclassify notes by real work task and domain
        run: python scripts/reclassify_work_system.py
      - name: Rebuild task-aware callable Work System model
        run: python scripts/build_system_model_v3.py
      - name: Commit refreshed encrypted work system
        run: |
          git config user.name "work-system-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/work-system.json data/work-system.enc.json data/system-model.json data/system-model.enc.json
          git diff --cached --quiet || git commit -m "Sync and consolidate personal work system"
          git push
