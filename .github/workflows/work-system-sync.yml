name: Sync personal work system

on:
  workflow_dispatch:
  schedule:
    # Friday 18:20 Japan time = 09:20 UTC
    - cron: "20 9 * * 5"
  push:
    branches: [main]
    paths:
      - "scripts/work_taxonomy.py"
      - "scripts/work_taxonomy_v4.py"
      - "scripts/reclassify_work_system.py"
      - "scripts/build_system_model_v3.py"
      - "scripts/build_system_model_precision.py"
      - "scripts/build_semantic_index.py"
      - "semantic-worker-source.txt"
      - "work-system-vector-v6-source.txt"
      - ".github/workflows/work-system-sync.yml"

permissions:
  contents: write

# Notion and Google Work System both rebuild system-model + semantic-index.
# Use one cross-workflow lock to keep encrypted snapshots coherent.
concurrency:
  group: personal-intelligence-model-write
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      DASHBOARD_PASSPHRASE: ${{ secrets.DASHBOARD_PASSPHRASE }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      SEMANTIC_MODEL_ID: intfloat/multilingual-e5-small
      SEMANTIC_BROWSER_MODEL_ID: Xenova/multilingual-e5-small
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: multilingual-e5-small-v1
      - name: Install Python dependencies
        run: python -m pip install "requests>=2.32,<3" "cryptography>=42,<47" "google-auth>=2.35,<3" "openpyxl>=3.1,<4" "openai>=1.0,<3" "sentence-transformers>=5,<6"
      - name: Build browser-local semantic runtime
        run: |
          npm install --no-save @huggingface/transformers@3.8.1 esbuild
          cp semantic-worker-source.txt semantic-worker-entry.js
          npx esbuild semantic-worker-entry.js --bundle --format=esm --platform=browser --target=es2022 --outfile=semantic-worker.bundle.js
          cp work-system-vector-v6-source.txt work-system-vector-v6.js
          rm semantic-worker-entry.js
      - name: Sync Google work experience and reading notes
        run: python scripts/sync_work_system.py
      - name: Reclassify notes by real work task and domain
        run: python scripts/reclassify_work_system.py
      - name: Rebuild task-aware callable Work System model
        run: python scripts/build_system_model_precision.py
      - name: Build encrypted multilingual semantic index
        run: python scripts/build_semantic_index.py
      - name: Commit refreshed encrypted work system safely
        run: |
          set -euo pipefail
          out=/tmp/work-system-model-output
          mkdir -p "$out/data"
          cp data/work-system.json data/work-system.enc.json data/system-model.json data/system-model.enc.json data/semantic-index.json data/semantic-index.enc.json "$out/data/"
          cp semantic-worker.bundle.js work-system-vector-v6.js "$out/"
          git fetch origin main
          git reset --hard origin/main
          cp "$out"/data/* data/
          cp "$out"/semantic-worker.bundle.js "$out"/work-system-vector-v6.js .
          git config user.name "work-system-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/work-system.json data/work-system.enc.json data/system-model.json data/system-model.enc.json data/semantic-index.json data/semantic-index.enc.json semantic-worker.bundle.js work-system-vector-v6.js
          if ! git diff --cached --quiet; then
            git commit -m "Sync work system and encrypted semantic index"
            git push origin HEAD:main
          fi
